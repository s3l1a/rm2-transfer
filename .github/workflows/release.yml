name: release-windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: test
        run: python -m pytest -q

      - name: build
        run: pyinstaller --clean --noconfirm windows.spec

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path dist\rm2-transfer -DestinationPath "rm2-transfer-${{ github.ref_name }}-windows.zip"

      - name: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "rm2-transfer-$tag-windows.zip"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --notes "Windows build. Unzip and run rm2-transfer\rm2-transfer.exe."
          }
          gh release upload $tag $asset --clobber
